name: Mobile CI

on:
  push:
    branches:
      - main
      - master
      - "feature/**"
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Mobile dependency security gate (high+)
        run: npm run security:audit

      - name: Run Expo Doctor
        run: npx expo-doctor

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - run: mkdir -p artifacts

      - name: Run unit, component and deterministic client integration tests
        run: npm test -- --ci --json --outputFile=artifacts/jest.json

      - name: Run HTTP contracts and security gate tests
        run: npm run test:contracts

      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-test-evidence
          path: artifacts/
          retention-days: 14
