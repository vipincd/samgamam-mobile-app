name: One-time mobile dependency remediation

on:
  push:
    branches:
      - "feature/samgamam-world-class-production-readiness"

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile from supported overrides
        run: npm install --package-lock-only --ignore-scripts

      - name: Remove one-time workflow and commit lockfile
        run: |
          set -euo pipefail
          rm .github/workflows/dependency-remediation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/dependency-remediation.yml
          if git diff --cached --quiet; then
            echo "No lockfile change produced"
            exit 1
          fi
          git commit -m "chore(deps): regenerate mobile lockfile for security overrides"
          git push origin "HEAD:${GITHUB_REF_NAME}"
