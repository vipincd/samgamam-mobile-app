appId: com.samgamam.mobile
---
- runScript:
    file: ../scripts/reset.js
    env:
      MODE: success
- runFlow: ../launch.yaml
- tapOn: "Groups"
- assertVisible: "Community circles"
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Search events|Quickstep isn't responding|System UI isn't responding"
    timeout: 60000
- runFlow: ../dismiss-launcher-anr.yaml
- extendedWaitUntil:
    visible: "Search events"
    timeout: 60000
- assertVisible: "Profile"
- takeScreenshot: relaunch
